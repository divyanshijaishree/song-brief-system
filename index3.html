<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login Page</title>
<style>
  /* Reset and base */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body, html {
    height: 100%;
    font-family: 'Arial', sans-serif;
    background: #080808;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    max-width: 960px;
    width: 100%;
    min-height: 600px;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    padding: 20px;
  }

  .left-section {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-left: 20px;
  }

  .left-section h1 {
    font-size: 3.5rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    user-select: none;
  }

  .login-card {
    position: relative;
    background: rgba(30, 30, 30, 0.8);
    border-radius: 12px;
    backdrop-filter: blur(12px);
    box-shadow:
      inset 0 0 10px rgba(255, 255, 255, 0.05),
      0 0 30px rgba(138, 43, 226, 0.5);
    padding: 40px 36px 36px 36px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Gradient Purple Circles Behind */
  .circle-top {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #5605d8, transparent 60%);
    top: -80px;
    left: -55px;
    z-index: 0;
  }
  .circle-bottom {
    position: absolute;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle at 60% 60%, #5605d8, transparent 70%);
    bottom: -70px;
    right: -60px;
    z-index: 0;
  }

  .login-card * {
    position: relative;
    z-index: 1;
  }


  .login-header {
    margin-bottom: 18px;
  }

  .login-header h2 {
    font-weight: 600;
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  .login-header p {
    font-size: 0.85rem;
    font-weight: 400;
    color: #ccc;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  label {
    font-size: 0.9rem;
    font-weight: 500;
    margin-bottom: 6px;
    display: block;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    height: 34px;
    padding: 6px 12px;
    border-radius: 5px;
    border: 1.2px solid #4a4a4a;
    background-color: #161616;
    color: white;
    font-size: 1rem;
    font-weight: 400;
  }
  input[type="text"]::placeholder,
  input[type="password"]::placeholder {
    color: #7a7a7a;
  }
  input[type="password"] {
    letter-spacing: 0.3em;
  }

  .password-field {
    position: relative;
    display: flex;
    align-items: center;
  }

  .password-field input {
    flex-grow: 1;
  }

  .remember-me {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    cursor: pointer;
    user-select: none;
    color: #ccc;
  }

  .remember-me input[type=checkbox] {
    width: 14px;
    height: 14px;
    accent-color: #6600ff;
  }

  button.login-btn {
    width: 100%;
    height: 38px;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    font-size: 1.1rem;
    color: white;
    background: linear-gradient(90deg, #836fff, #4000bb);
    cursor: pointer;
    transition: background 0.3s ease;
  }

  button.login-btn:hover {
    background: linear-gradient(90deg, #4000bb, #836fff);
  }

  .forgot-password {
    margin-top: 10px;
    font-size: 0.88rem;
    text-align: center;
    color: #bbb;
    cursor: pointer;
    user-select: none;
    text-decoration: underline;
  }

  .divider-container {
    margin: 24px 0 14px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .divider-container hr {
    flex-grow: 1;
    height: 1px;
    border: none;
    background-color: #343434;
  }
  .divider-text {
    font-size: 0.9rem;
    color: #aaa;
    font-weight: 500;
  }

  .social-icons {
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  .social-icons svg {
    width: 28px;
    height: 28px;
    cursor: pointer;
    fill: #bbb;
    transition: fill 0.3s ease;
  }
  .social-icons svg:hover {
    fill: #7b54ff;
  }

  .signup-section {
    margin-top: 28px;
    text-align: center;
    color: #ccc;
    font-size: 0.9rem;
    user-select: none;
  }
  .signup-section a {
    color: #836fff;
    cursor: pointer;
    margin-left: 4px;
    text-decoration: none;
    font-weight: 600;
  }
  .signup-section a:hover {
    text-decoration: underline;
  }

  .footer-links {
    margin-top: 32px;
    font-size: 0.8rem;
    color: #6e6e6e;
    display: flex;
    justify-content: center;
    gap: 32px;
    user-select: none;
  }
  .footer-links span,
  .footer-links a {
    color: #6e6e6e;
    cursor: pointer;
    font-weight: 600;
    text-decoration: none;
  }
  .footer-links a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="container" role="main" aria-label="Login page container">
    <div class="left-section" aria-label="Welcome text section">
      <h1>Welcome Back .!</h1>
    </div>

    <section class="login-card" aria-labelledby="loginHeading" tabindex="0">
      <div class="circle-top" aria-hidden="true"></div>
      <div class="circle-bottom" aria-hidden="true"></div>

      <header class="login-header">
        <h2 id="loginHeading">Login</h2>
        <p>Glad you're back ?</p>
      </header>

      <form aria-describedby="loginFormDesc" autocomplete="off" spellcheck="false" novalidate>
        <div id="loginFormDesc" class="sr-only">Form to login using username and password</div>
        <label for="username" >Username</label>
        <input type="text" id="username" name="username" placeholder="Username" aria-required="true" autocomplete="username" />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password" aria-required="true" autocomplete="current-password" />

        <div class="remember-me">
          <input type="checkbox" id="remember" name="remember" />
          <label for="remember" style="user-select:none;">Remember me</label>
        </div>

        <button type="submit" class="login-btn" aria-label="Login to your account">Login</button>
      </form>

      <div class="forgot-password" role="button" tabindex="0" aria-label="Forgot password option" aria-describedby="forgotDesc">
        Forgot password ?
        <span id="forgotDesc" class="sr-only">Click or press enter to recover your password</span>
      </div>

      <div class="divider-container" aria-hidden="true">
        <hr />
        <div class="divider-text">Or</div>
        <hr />
      </div>

      <div class="social-icons" role="group" aria-label="Social login options">
        <!-- Google icon -->
        <svg aria-labelledby="googleTitle" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title id="googleTitle">Google sign in</title><path d="M21.805 10.023h-9.32v3.955h5.325c-.223 1.276-1.25 3.745-5.325 3.745-3.204 0-5.82-2.654-5.82-5.93s2.616-5.93 5.82-5.93c1.82 0 3.042.766 3.748 1.427l2.55-2.452c-1.502-1.39-3.436-2.238-6.298-2.238-5.606 0-10.165 4.701-10.165 10.49s4.56 10.49 10.165 10.49c5.869 0 9.784-4.114 9.784-9.91 0-.67-.08-1.18-.178-1.677z"/></svg>

        <!-- Facebook icon -->
        <svg aria-labelledby="facebookTitle" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title id="facebookTitle">Facebook sign in</title><path d="M22.675 0h-21.35c-.74 0-1.325.576-1.325 1.315v21.37c0 .74.585 1.315 1.325 1.315h11.498v-9.294h-3.125v-3.622h3.125v-2.672c0-3.097 1.894-4.783 4.658-4.783 1.325 0 2.464.098 2.795.141v3.24l-1.917.001c-1.504 0-1.795.715-1.795 1.762v2.312h3.587l-.467 3.622h-3.12v9.293h6.105c.74 0 1.325-.575 1.325-1.315v-21.37c0-.74-.585-1.315-1.324-1.315z"/></svg>

        <!-- GitHub icon -->
        <svg aria-labelledby="githubTitle" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title id="githubTitle">GitHub sign in</title><path fill-rule="evenodd" clip-rule="evenodd" d="M12 .297C5.37.297 0 5.67 0 12.297c0 5.295 3.438 9.789 8.207 11.387.6.113.82-.258.82-.577 0-.285-.012-1.237-.02-2.243-3.338.726-4.042-1.61-4.042-1.61-.546-1.38-1.335-1.75-1.335-1.75-1.09-.75.083-.735.083-.735 1.205.086 1.838 1.236 1.838 1.236 1.07 1.83 2.807 1.3 3.492.994.11-.775.418-1.3.76-1.6-2.665-.3-5.467-1.337-5.467-5.942 0-1.312.465-2.383 1.236-3.225-.124-.303-.535-1.523.116-3.176 0 0 1.007-.32 3.3 1.23a11.54 11.54 0 0 1 3.003-.404c1.018.004 2.044.137 3.003.404 2.29-1.55 3.295-1.23 3.295-1.23.652 1.653.242 2.873.12 3.176.77.842 1.237 1.913 1.237 3.225 0 4.61-2.807 5.637-5.48 5.932.43.37.81 1.096.81 2.214 0 1.6-.014 2.885-.014 3.28 0 .322.216.697.825.578C20.565 22.08 24 17.59 24 12.295 24 5.67 18.63.297 12 .297z"/></svg>
      </div>

      <div class="signup-section">
        Don’t have an account ? <a href="#" tabindex="0" aria-label="Sign up for new account">Signup</a>
      </div>

      <nav class="footer-links" aria-label="Support and legal links">
        <span>Terms & Conditions</span>
        <span>Support</span>
        <span>Customer Care</span>
      </nav>
    </section>
  </div>
</body>
</html>
