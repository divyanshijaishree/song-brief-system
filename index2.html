<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signup Page</title>
  <style>
    /* Reset and base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body, html {
      height: 100%;
      background-color: #0b0b0b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
    }
    .container {
      width: 900px;
      max-width: 90vw;
      height: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    /* Left side welcome text */
    .welcome {
      font-weight: 700;
      font-size: 3.5rem;
      line-height: 1;
      letter-spacing: -1.25px;
      margin-left: 10px;
      position: relative;
      user-select: none;
    }
    .welcome::after {
      content: '';
      height: 3px;
      width: 170px;
      background: linear-gradient(to right, #3f3f3f, transparent);
      vertical-align: middle;
      position: absolute;
      top: 38px;
      left: 190px;
      border-radius: 2px;
      opacity: 0.5;
    }
    /* Right side form panel */
    .form-panel {
      background: rgba(255 255 255 / 0.05);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      padding: 40px 30px 30px 30px;
      width: 350px;
      border-radius: 12px;
      box-shadow:
        inset 0 0 25px 3px rgba(255 255 255 / 0.08),
        0 0 35px 7px rgba(39 27 255 / 0.13);
      color: white;
      display: flex;
      flex-direction: column;
    }
    /* Purple blurred circles - top & bottom */
    .form-panel::before, .form-panel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 1;
      pointer-events: none;
    }
    .form-panel::before {
      width: 150px;
      height: 150px;
      background: #2e20e0;
      top: -65px;
      right: 24px;
      opacity: 0.57;
    }
    .form-panel::after {
      width: 130px;
      height: 130px;
      background: #2229f9;
      bottom: -68px;
      right: 16px;
      opacity: 0.3;
    }
    /* Because the form panel is relative for pseudo circles */
    .form-panel {
      position: relative;
      z-index: 10;
    }
    /* Signup header */
    .form-panel h2 {
      font-weight: 600;
      font-size: 1.4rem;
      margin-bottom: 7px;
      user-select: none;
    }
    .form-panel p.subtext {
      font-weight: 400;
      font-size: 0.9rem;
      color: #b9b9b9;
      margin-bottom: 30px;
      user-select: none;
    }
    /* Input fields */
    .form-panel input[type=text],
    .form-panel input[type=email],
    .form-panel input[type=password] {
      width: 100%;
      background: transparent;
      border: 1px solid #494848;
      border-radius: 7px;
      padding: 11px 14px;
      outline: none;
      color: white;
      font-size: 1rem;
      margin-bottom: 18px;
      transition: border-color 0.35s ease;
    }
    .form-panel input::placeholder {
      color: #7b7b7b;
      user-select: none;
    }
    .form-panel input:focus {
      border-color: #4a64ff;
      box-shadow: 0 0 9px rgba(74, 100, 255, 0.6);
    }
    /* Signup button */
    .form-panel button.signup-btn {
      background: linear-gradient(90deg, #3349ff 0%, #5a48fa 100%);
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      padding: 11px 0;
      width: 290px;
      cursor: pointer;
      margin-top: 6px;
      margin-bottom: 25px;
      transition: background 0.3s ease;
      user-select: none;
    }
    .form-panel button.signup-btn:hover {
      background: linear-gradient(90deg, #5a48fa 0%, #3349ff 100%);
    }
    /* Horizontal or divider line */
    .divider {
      text-align: center;
      font-weight: 500;
      font-size: 14px;
      color: #8a8a8a;
      margin-bottom: 20px;
      border-bottom: 1px solid #363535;
      line-height: 0.1em;
      user-select: none;
      position: relative;
      z-index: 10;
    }
    .divider span {
      background: #0b0b0b;
      padding: 0 12px;
    }
    /* Social icon container */
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 30px;
      user-select: none;
    }
    .social-icons button {
      border: none;
      cursor: pointer;
      background: transparent;
      padding: 0;
      width: 40px;
      height: 40px;
      filter: drop-shadow(0 3px 1px rgba(0,0,0,.2));
      transition: filter 0.25s ease;
    }
    .social-icons button:hover {
      filter: drop-shadow(0 0 10px #fff);
    }
    .social-icons svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: white;
    }
    /* Footer links below */
    .form-footer {
      font-weight: 400;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      color: #7b7b7b;
      user-select: none;
    }
    .form-footer .login {
      cursor: pointer;
      color: #8a8aff;
      text-decoration: underline;
    }
    .form-footer a {
      color: #7b7b7b;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .form-footer a:hover {
      color: #8a8aff;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container" role="main" aria-label="Signup page content">
    <h1 class="welcome">welcome!</h1>

    <section class="form-panel" aria-label="Signup form with inputs and social login">

        <input type="password" name="password" placeholder="Password" aria-label="Password" required />
        <input type="password" name="confirm_password" placeholder="Confirm Password" aria-label="Confirm Password" required />
        <button type="submit" class="signup-btn" aria-label="Signup">Signup</button>

<div class="form-footer" role="contentinfo" aria-label="Additional links for registration and support">

</body>
</html>
